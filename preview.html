<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuroForge — Holographic Preview</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000810;color:#00e5ff;font-family:'Courier New',monospace;overflow:hidden;user-select:none}
canvas{display:block;position:fixed;inset:0;top:52px}
nav{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;padding:0 28px;height:52px;background:rgba(0,8,16,.97);border-bottom:1px solid #001a2e}
.brand{font-size:13px;letter-spacing:4px;color:#00e5ff;margin-right:48px}
.tab{background:transparent;border:none;border-bottom:2px solid transparent;color:#003344;font-family:'Courier New',monospace;font-size:11px;letter-spacing:3px;padding:0 20px;height:52px;cursor:pointer;transition:all .2s}
.tab.on{color:#00e5ff;border-bottom-color:#00e5ff}
.tab:hover{color:#007799}
.sys{margin-left:auto;font-size:10px;letter-spacing:3px;color:#002244;animation:blink 1.8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
#hud{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:11px 28px;background:linear-gradient(0deg,rgba(0,8,16,.97),transparent);border-top:1px solid #001a2e;font-size:10px;letter-spacing:2px;color:#003344;pointer-events:none}
.corner{position:fixed;width:18px;height:18px;opacity:.45;z-index:10;pointer-events:none}
.tl{top:60px;left:12px;border-top:1px solid #00e5ff;border-left:1px solid #00e5ff}
.tr{top:60px;right:12px;border-top:1px solid #00e5ff;border-right:1px solid #00e5ff}
.bl{bottom:42px;left:12px;border-bottom:1px solid #00e5ff;border-left:1px solid #00e5ff}
.br{bottom:42px;right:12px;border-bottom:1px solid #00e5ff;border-right:1px solid #00e5ff}
.panel{position:fixed;background:rgba(0,8,20,.96);border:1px solid #00e5ff;padding:20px 22px;font-family:'Courier New',monospace;z-index:20;min-width:230px;box-shadow:0 0 40px rgba(0,229,255,.1);backdrop-filter:blur(8px);display:none}
.panel.on{display:block}
#sp{top:18%;right:3%}
#dp{top:18%;left:3%;min-width:252px}
.pt{font-size:12px;font-weight:bold;letter-spacing:2px;color:#00e5ff;margin-bottom:6px}
.pdiv{height:1px;background:#001a2e;margin-bottom:12px}
.pd{color:#0088aa;font-size:11px;line-height:1.7;margin-bottom:12px}
.bl-lbl{color:#004455;font-size:10px;letter-spacing:2px;margin-bottom:5px}
.bl-bg{height:3px;background:#001122;border-radius:2px;overflow:hidden;margin-bottom:12px}
.bl-fill{height:100%;background:linear-gradient(90deg,#0044ff,#00ffff);width:0;transition:width 1.2s ease}
.pbtn{background:transparent;border:1px solid #003344;color:#00e5ff;padding:4px 12px;cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:2px;width:100%;margin-top:2px}
.pbtn:hover{border-color:#00e5ff}
.arow{display:flex;align-items:center;gap:7px;padding:4px 0;border-bottom:1px solid #001122}
.adot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.aname{color:#0077aa;font-size:10px;letter-spacing:1px}
.ast{margin-left:auto;font-size:9px}
</style>
</head>
<body>
<nav>
  <span class="brand">NEUROFORGE</span>
  <button class="tab on" id="t-holo" onclick="switchTo('holo')">AGENT HOLOGRAM</button>
  <button class="tab"    id="t-brain" onclick="switchTo('brain')">NEURAL MAP</button>
  <span class="sys">◉ SYSTEM ONLINE</span>
</nav>
<canvas id="c"></canvas>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>
<div id="hud">
  <span id="hl">◉ HOLOGRAM ACTIVE</span>
  <span>DRAG TO ROTATE  •  CLICK SKILLS TO INSPECT</span>
  <span style="animation:blink 1.8s infinite">●</span>
</div>

<div class="panel" id="sp">
  <div class="pt" id="sp-n">SKILL</div>
  <div class="pdiv"></div>
  <div class="pd" id="sp-d"></div>
  <div class="bl-lbl" id="sp-l">PROFICIENCY</div>
  <div class="bl-bg"><div class="bl-fill" id="sp-b"></div></div>
  <button class="pbtn" onclick="closeSP()">[ CLOSE DATAFILE ]</button>
</div>
<div class="panel" id="dp">
  <div class="pt" id="dp-n">DEPARTMENT</div>
  <div class="pdiv"></div>
  <div class="pd" id="dp-d"></div>
  <div id="dp-a"></div>
  <button class="pbtn" style="margin-top:10px" onclick="closeDP()">[ COLLAPSE CLUSTER ]</button>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const SKILLS=[
  {name:'MACHINE LEARNING', level:95, desc:'Deep neural network design & training pipelines.'},
  {name:'NLP PROCESSING',   level:88, desc:'Language model fine-tuning and RAG systems.'},
  {name:'COMPUTER VISION',  level:82, desc:'Real-time image analysis and segmentation.'},
  {name:'DATA ENGINEERING', level:79, desc:'Distributed processing at petabyte scale.'},
  {name:'API DESIGN',       level:91, desc:'RESTful & GraphQL microservice architecture.'},
  {name:'CLOUD DEPLOY',     level:85, desc:'Kubernetes orchestration across multi-cloud.'},
]
const DEPTS=[
  {n:'RESEARCH CORE',    c:'#00e5ff', desc:'Advanced AI research cluster.',   ag:[{n:'NEXUS',a:1},{n:'ARIA',a:1},{n:'HELIOS',a:0}]},
  {n:'DATA MINING',      c:'#0088ff', desc:'Data extraction & recognition.',  ag:[{n:'VECTOR',a:1},{n:'SIGMA',a:1}]},
  {n:'NEURAL SYNTHESIS', c:'#00ffaa', desc:'Knowledge synthesis node.',       ag:[{n:'LYRA',a:1},{n:'ORION',a:1},{n:'PULSE',a:0},{n:'ECHO',a:1}]},
  {n:'DEPLOYMENT',       c:'#ff6600', desc:'Production orchestration.',       ag:[{n:'TITAN',a:1},{n:'ATLAS',a:0}]},
  {n:'SECURITY',         c:'#aa00ff', desc:'Threat detection & compliance.',  ag:[{n:'SHIELD',a:1},{n:'CIPHER',a:1}]},
  {n:'ANALYTICS',        c:'#ffcc00', desc:'Metrics & predictive analytics.', ag:[{n:'PRISM',a:1},{n:'LENS',a:0}]},
]

// ── CANVAS SETUP ──────────────────────────────────────────────────────────────
const cv = document.getElementById('c')
const ctx = cv.getContext('2d')
let W, H
function resize() {
  W = cv.width  = window.innerWidth
  H = cv.height = window.innerHeight - 52
}
resize()
window.addEventListener('resize', resize)

let view = 'holo'
let t = 0
let selSkill = -1
let selDept  = -1
let expandT  = 0   // time since dept selected (for agent expansion animation)

// ── HELPERS ──────────────────────────────────────────────────────────────────
function hex2rgb(h){
  const r=parseInt(h.slice(1,3),16), g=parseInt(h.slice(3,5),16), b=parseInt(h.slice(5,7),16)
  return [r,g,b]
}
function glow(color, blur=18){ctx.shadowColor=color; ctx.shadowBlur=blur}
function noGlow(){ctx.shadowBlur=0}
function lerp(a,b,t){return a+(b-a)*t}
function easeOut(t){return 1-(1-t)*(1-t)}

// ── PARTICLES (hologram scene) ────────────────────────────────────────────────
const PARTS = Array.from({length:160},()=>({
  x:(Math.random()-.5)*1.8,
  y:(Math.random()-.3)*2.4,
  vx:(Math.random()-.5)*.5,
  vy:Math.random()*.18+.04,
  life:Math.random(),
  sz:Math.random()*2+1,
}))

// ── STARS ─────────────────────────────────────────────────────────────────────
const STARS = Array.from({length:180},()=>({
  x:Math.random()*2-1,
  y:Math.random()*2-1,
  r:Math.random()*.8+.1,
  a:Math.random(),
}))

// ── DRAW HOLOGRAM SCENE ──────────────────────────────────────────────────────
function drawHolo() {
  const cx = W/2, cy = H/2

  // BG
  ctx.fillStyle = '#000810'
  ctx.fillRect(0,0,W,H)

  // Stars
  STARS.forEach(s=>{
    const sx = cx + s.x*W*.55, sy = cy + s.y*H*.5
    ctx.beginPath()
    ctx.arc(sx,sy,s.r,0,Math.PI*2)
    ctx.fillStyle = `rgba(255,255,255,${s.a*.55})`
    ctx.fill()
  })

  // ── GRID FLOOR (perspective) ──
  ctx.save()
  const gh = H*.38  // horizon line
  const gLines = 14, gCols = 14
  ctx.strokeStyle = '#002233'
  ctx.lineWidth = .7
  // horizontal grid lines
  for(let i=0;i<=gLines;i++){
    const prog = i/gLines
    const yy = lerp(cy+H*.12, H+20, prog*prog)
    const ww = lerp(0, W*1.4, prog*prog)
    const xx = cx - ww/2
    ctx.beginPath(); ctx.moveTo(xx, yy); ctx.lineTo(xx+ww, yy); ctx.stroke()
  }
  // vertical grid lines
  for(let j=0;j<=gCols;j++){
    const prog = j/gCols
    const bx = lerp(cx-W*.7, cx+W*.7, prog)
    ctx.beginPath(); ctx.moveTo(cx + (bx-cx)*.0, cy+H*.12); ctx.lineTo(bx, H+20); ctx.stroke()
  }
  // Concentric circles on floor (faint cyan)
  ;[.28,.5,.72,.95].forEach((r,i)=>{
    ctx.save()
    ctx.translate(cx, cy+H*.38)
    ctx.scale(1,.22)
    ctx.beginPath(); ctx.arc(0,0,W*r*.32,0,Math.PI*2)
    ctx.strokeStyle=`rgba(0,229,255,${.07/(i+1)})`
    ctx.lineWidth=1.5; ctx.stroke()
    ctx.restore()
  })
  ctx.restore()

  // ── PROJECTION BEAM ──
  const beamH = H*.55
  const beamW = W*.08
  const beamTop = cy - H*.28
  const beamBot = cy + H*.3

  ctx.save()
  // outer beam
  const beamGrad = ctx.createLinearGradient(cx, beamTop, cx, beamBot)
  const bp = .5 + .5*Math.sin(t*2.5)
  beamGrad.addColorStop(0, `rgba(0,229,255,0)`)
  beamGrad.addColorStop(.4, `rgba(0,229,255,${.06*bp})`)
  beamGrad.addColorStop(1, `rgba(0,229,255,${.18*bp})`)
  ctx.beginPath()
  ctx.moveTo(cx, beamTop)
  ctx.lineTo(cx - beamW*3, beamBot)
  ctx.lineTo(cx + beamW*3, beamBot)
  ctx.closePath()
  ctx.fillStyle = beamGrad; ctx.fill()

  // inner bright beam
  const ibGrad = ctx.createLinearGradient(cx,beamTop,cx,beamBot)
  ibGrad.addColorStop(0,`rgba(0,229,255,0)`)
  ibGrad.addColorStop(.5,`rgba(0,229,255,${.1*bp})`)
  ibGrad.addColorStop(1,`rgba(0,229,255,${.35*bp})`)
  ctx.beginPath()
  ctx.moveTo(cx, beamTop)
  ctx.lineTo(cx - beamW, beamBot)
  ctx.lineTo(cx + beamW, beamBot)
  ctx.closePath()
  ctx.fillStyle = ibGrad; ctx.fill()

  // scan bands inside beam
  for(let s=0;s<5;s++){
    const scanY = beamBot - ((t*60 + s*35) % beamH)
    const scanProg = 1 - (scanY - beamTop)/(beamBot - beamTop)
    const scanW = beamW*3*scanProg
    ctx.beginPath()
    ctx.moveTo(cx-scanW*.5, scanY)
    ctx.lineTo(cx+scanW*.5, scanY)
    ctx.strokeStyle=`rgba(0,229,255,${.15*bp})`; ctx.lineWidth=.8; ctx.stroke()
  }

  // base disc glow
  ctx.save(); ctx.translate(cx, beamBot); ctx.scale(1,.18)
  const dg = ctx.createRadialGradient(0,0,0,0,0,beamW*3)
  dg.addColorStop(0,`rgba(0,229,255,${.25*bp})`)
  dg.addColorStop(1,'rgba(0,229,255,0)')
  ctx.beginPath(); ctx.arc(0,0,beamW*3,0,Math.PI*2)
  ctx.fillStyle=dg; ctx.fill(); ctx.restore()
  ctx.restore()

  // ── ORBIT RINGS ──
  const rings = [{r:.34,tilt:.05},{r:.46,tilt:.55},{r:.58,tilt:-.44},{r:.7,tilt:.8}]
  rings.forEach(({r,tilt},i)=>{
    ctx.save(); ctx.translate(cx,cy)
    ctx.rotate(tilt); ctx.scale(1, Math.abs(Math.sin(tilt+.7))*.5+.15)
    ctx.beginPath(); ctx.arc(0,0,W*r*.27,0,Math.PI*2)
    ctx.strokeStyle=`rgba(0,229,255,${.1+i*.02})`; ctx.lineWidth=1; ctx.stroke()
    ctx.restore()
  })

  // ── AVATAR ──
  drawAvatar(cx, cy, t)

  // ── PARTICLES ──
  PARTS.forEach(p=>{
    const lt = (t*.5 + p.life) % 1
    const px = cx + (p.x + p.vx*lt*2.2)*W*.14
    const py = (cy - H*.22) + (p.y + p.vy*lt*1.8 + lt*1.5)*H*.22
    const alpha = (1-lt)*(1-lt)*.7
    glow('#00e5ff',8)
    ctx.beginPath(); ctx.arc(px,py,p.sz,0,Math.PI*2)
    ctx.fillStyle=`rgba(0,229,255,${alpha})`; ctx.fill()
  })
  noGlow()

  // ── SKILL TAGS ──
  const tagRects = []
  SKILLS.forEach((sk,i)=>{
    const orR = (1.5 + (i%3)*.75) * W*.09
    const spd = .22 + i*.06
    const orY = (i%2===0 ? .22 : -.16) + i*.03
    const a = (i/SKILLS.length)*Math.PI*2 + t*spd
    const tx = cx + Math.cos(a)*orR
    const ty = cy + Math.sin(a)*orR*.38 + orY*H*.3

    const tw=130, th=32
    const sel = selSkill===i
    const hover = hoverIdx===i

    ctx.save()
    // panel
    ctx.fillStyle = sel ? '#00e5ff' : 'rgba(0,18,42,.92)'
    ctx.strokeStyle = hover||sel ? '#00e5ff' : '#006688'
    ctx.lineWidth = 1
    if(sel||hover){glow('#00e5ff',12)}
    roundRect(ctx, tx-tw/2, ty-th/2, tw, th, 1)
    ctx.fill(); ctx.stroke()
    noGlow()

    // corner accents
    const co = sel?'#001122':'#00e5ff'
    ;[[tx-tw/2,ty-th/2],[tx+tw/2,ty-th/2],[tx-tw/2,ty+th/2],[tx+tw/2,ty+th/2]].forEach(([qx,qy])=>{
      ctx.fillStyle=co; ctx.fillRect(qx-2.5,qy-2.5,5,5)
    })

    // text
    ctx.fillStyle = sel?'#001122':'#00e5ff'
    ctx.font = 'bold 9px Courier New'
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
    if(!sel) glow('#00e5ff',7)
    ctx.fillText(sk.name, tx, ty)
    noGlow()

    // level bar
    if(!sel){
      const bw = tw*.8, bh = 2
      ctx.fillStyle='#001a2e'; ctx.fillRect(tx-bw/2, ty+th/2-5, bw, bh)
      ctx.fillStyle='#00e5ff'; ctx.fillRect(tx-bw/2, ty+th/2-5, bw*sk.level/100, bh)
    }

    ctx.restore()
    tagRects.push({x:tx-tw/2, y:ty-th/2, w:tw, h:th, i})
  })
  window._tagRects = tagRects

  // ── AGENT NAME ──
  ctx.font='bold 14px Courier New'; ctx.textAlign='center'; ctx.textBaseline='middle'
  ctx.fillStyle='#00e5ff'
  glow('#00e5ff',20)
  ctx.fillText('NEXUS', cx, cy+H*.36)
  noGlow()
  ctx.font='10px Courier New'; ctx.fillStyle='#005577'
  ctx.fillText('SENIOR AI ARCHITECT', cx, cy+H*.41)
}

function drawAvatar(cx, cy, t) {
  const sc = Math.min(W,H)*.0026
  ctx.save()
  ctx.translate(cx, cy - H*.04)

  // Glow aura
  const aura = ctx.createRadialGradient(0,0,10*sc,0,0,120*sc)
  aura.addColorStop(0,'rgba(0,229,255,.07)')
  aura.addColorStop(1,'rgba(0,229,255,0)')
  ctx.fillStyle=aura; ctx.fillRect(-130*sc,-160*sc,260*sc,320*sc)

  // Flickering
  const flick = 1 - .06*Math.sin(t*19)*Math.sin(t*7+2)

  // Edge glow rect
  ctx.save()
  glow('#00e5ff',22)
  ctx.strokeStyle=`rgba(0,229,255,${.55*flick})`; ctx.lineWidth=1.2
  ctx.strokeRect(-102*sc,-145*sc,204*sc,285*sc)
  noGlow()
  ctx.restore()

  // Body - draw holographic humanoid
  ctx.strokeStyle=`rgba(0,229,255,${.9*flick})`
  ctx.lineWidth=2*sc; glow('#00e5ff',14)

  // Head
  ctx.beginPath(); ctx.ellipse(0,-95*sc,42*sc,52*sc,0,0,Math.PI*2); ctx.stroke()

  // Eyes
  ctx.fillStyle=`rgba(0,229,255,${flick})`
  ctx.shadowBlur=18
  ;[[-16*sc,-92*sc],[16*sc,-92*sc]].forEach(([ex,ey])=>{
    ctx.beginPath(); ctx.ellipse(ex,ey,9*sc,5.5*sc,0,0,Math.PI*2); ctx.fill()
  })
  ctx.fillStyle='#001122'; ctx.shadowBlur=0
  ;[[-16*sc,-92*sc],[16*sc,-92*sc]].forEach(([ex,ey])=>{
    ctx.beginPath(); ctx.arc(ex,ey,3*sc,0,Math.PI*2); ctx.fill()
  })

  // Neck
  ctx.strokeStyle=`rgba(0,229,255,${.8*flick})`
  ctx.lineWidth=2*sc; glow('#00e5ff',10)
  ctx.beginPath()
  ctx.moveTo(-12*sc,-44*sc); ctx.lineTo(-12*sc,-24*sc)
  ctx.moveTo( 12*sc,-44*sc); ctx.lineTo( 12*sc,-24*sc)
  ctx.stroke()

  // Body outline
  ctx.lineWidth=2.2*sc; glow('#00e5ff',12)
  ctx.beginPath()
  ctx.moveTo(-12*sc,-24*sc); ctx.bezierCurveTo(-30*sc,-18*sc,-60*sc,-10*sc,-65*sc,25*sc)
  ctx.lineTo(-58*sc,135*sc)
  ctx.moveTo(12*sc,-24*sc); ctx.bezierCurveTo(30*sc,-18*sc,60*sc,-10*sc,65*sc,25*sc)
  ctx.lineTo(58*sc,135*sc)
  // Arms
  ctx.moveTo(-65*sc,25*sc); ctx.bezierCurveTo(-80*sc,40*sc,-82*sc,70*sc,-72*sc,95*sc); ctx.lineTo(-85*sc,135*sc)
  ctx.moveTo(65*sc,25*sc);  ctx.bezierCurveTo(80*sc,40*sc,82*sc,70*sc,72*sc,95*sc);   ctx.lineTo(85*sc,135*sc)
  // Center line
  ctx.moveTo(0*sc,-24*sc); ctx.lineTo(0*sc,135*sc)
  // Horizontal lines
  ;[-5,25,55,90].forEach(y=>{
    ctx.moveTo(-62*sc,y*sc); ctx.lineTo(62*sc,y*sc)
  })
  ctx.stroke()

  // Circuit lines
  ctx.strokeStyle=`rgba(0,68,102,${.8*flick})`; ctx.lineWidth=.8*sc
  for(let i=0;i<8;i++){
    const yy = (-15+i*18)*sc
    ctx.beginPath()
    ctx.moveTo(-60*sc,yy); ctx.lineTo((-40+Math.sin(i*3+t)*8)*sc,yy)
    ctx.moveTo(60*sc,yy);  ctx.lineTo((40-Math.sin(i*2.5+t)*8)*sc,yy)
    ctx.stroke()
  }

  noGlow()

  // Scanlines overlay
  ctx.save()
  ctx.globalAlpha = .06*flick
  for(let sy=-145;sy<145;sy+=3){
    const scanA = .5+.5*Math.sin(sy*.08+t*3)
    ctx.fillStyle=`rgba(0,229,255,${scanA*.3})`
    ctx.fillRect(-102*sc,sy*sc,204*sc,1.2*sc)
  }
  ctx.globalAlpha=1
  ctx.restore()

  ctx.restore()
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y)
  ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r)
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h)
  ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r)
  ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath()
}

// ── DRAW BRAIN SCENE ─────────────────────────────────────────────────────────
let deptNodes = [] // computed each frame for click hit-testing

function drawBrain() {
  const cx = W/2, cy = H/2 - 20

  ctx.fillStyle='#000812'; ctx.fillRect(0,0,W,H)

  // Stars
  STARS.forEach(s=>{
    const sx=cx+s.x*W*.55, sy=cy+s.y*H*.52
    ctx.beginPath(); ctx.arc(sx,sy,s.r,0,Math.PI*2)
    ctx.fillStyle=`rgba(255,255,255,${s.a*.5})`; ctx.fill()
  })

  // Grid floor
  ctx.save()
  for(let i=0;i<=16;i++){
    const p=i/16, yy=lerp(cy+H*.18,H+20,p*p)
    const ww=lerp(0,W*1.5,p*p), xx=cx-ww/2
    ctx.beginPath(); ctx.moveTo(xx,yy); ctx.lineTo(xx+ww,yy)
    ctx.strokeStyle=`rgba(0,34,51,${.8*(1-p)})`; ctx.lineWidth=.6; ctx.stroke()
  }
  for(let j=0;j<=16;j++){
    const bx=lerp(cx-W*.75,cx+W*.75,j/16)
    ctx.beginPath(); ctx.moveTo(cx+(bx-cx)*.0,cy+H*.18); ctx.lineTo(bx,H+20)
    ctx.strokeStyle='rgba(0,34,51,.5)'; ctx.lineWidth=.5; ctx.stroke()
  }
  ctx.restore()

  // Ambient glow behind brain
  const bg = ctx.createRadialGradient(cx,cy,20,cx,cy,W*.18)
  bg.addColorStop(0,'rgba(0,40,80,.35)'); bg.addColorStop(1,'rgba(0,0,0,0)')
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H)

  // Brain mesh
  drawBrainMesh(cx, cy, t)

  // Dept positions
  deptNodes = []
  DEPTS.forEach((d,i)=>{
    const tier = Math.floor(i/4)
    const orR = (.28+tier*.09)*Math.min(W,H)
    const orY = (i%2===0?.14:-.14)*(1+tier*.3)*H
    const baseA = (i/DEPTS.length)*Math.PI*2
    const spd = (.12+i*.025)*(i%2===0?1:-1)
    const a = baseA + t*spd
    const dx = cx + Math.cos(a)*orR
    const dy = cy + orY*.35 + Math.sin(a)*orR*.4

    // Synapse line to brain
    const sel = selDept===i
    ctx.save()
    ctx.setLineDash([4,8])
    ctx.lineDashOffset = -(t*(sel?40:15))
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(dx,dy)
    ctx.strokeStyle = sel ? `rgba(0,229,255,.5)` : `rgba(0,40,60,.4)`
    ctx.lineWidth = sel?1.5:.7; ctx.stroke()
    ctx.setLineDash([]); ctx.restore()

    // Halo
    const pulse = 1+.2*Math.sin(t*2+baseA)
    const [r,g,b]=hex2rgb(d.c)
    ctx.save()
    glow(d.c, sel?28:14)
    ctx.beginPath(); ctx.arc(dx,dy,12*pulse,0,Math.PI*2)
    ctx.strokeStyle=d.c; ctx.lineWidth=sel?2:1.2; ctx.stroke()
    noGlow()

    // Ring
    ctx.save(); ctx.translate(dx,dy); ctx.scale(1,.28)
    ctx.beginPath(); ctx.arc(0,0,18*pulse,0,Math.PI*2)
    ctx.strokeStyle=`rgba(${r},${g},${b},.45)`; ctx.lineWidth=1.5; ctx.stroke()
    ctx.restore()

    // Core dot
    ctx.beginPath(); ctx.arc(dx,dy,7,0,Math.PI*2)
    const dg=ctx.createRadialGradient(dx,dy,0,dx,dy,7)
    dg.addColorStop(0,'#ffffff'); dg.addColorStop(.4,d.c); dg.addColorStop(1,d.c+'88')
    ctx.fillStyle=dg; ctx.fill()
    ctx.restore()

    // Label
    ctx.save()
    ctx.font=`bold 9px Courier New`; ctx.textAlign='center'; ctx.textBaseline='top'
    ctx.fillStyle=sel?d.c:'#005566'
    if(sel) glow(d.c,10)
    ctx.fillText(d.n, dx, dy+18)
    noGlow()
    const ag=d.ag.filter(a=>a.a).length
    ctx.font='8px Courier New'; ctx.fillStyle='#003344'
    ctx.fillText(ag+'/'+d.ag.length+' ACTIVE', dx, dy+30)
    ctx.restore()

    deptNodes.push({x:dx,y:dy,r:20,i})

    // Agent neurons (expand when selected)
    if(sel){
      const exp = Math.min(1, expandT/0.6)
      d.ag.forEach((ag,ai)=>{
        const aa = (ai/d.ag.length)*Math.PI*2
        const nr = 55*easeOut(exp)
        const nx = dx+Math.cos(aa+t*.35)*nr
        const ny = dy+Math.sin(aa+t*.35)*nr*.42
        const np = 1+.2*Math.sin(t*3.5+ai*2.1)
        ctx.save()
        glow(d.c, ag.a?12:4)
        ctx.beginPath(); ctx.arc(nx,ny,5*np,0,Math.PI*2)
        ctx.fillStyle = ag.a ? d.c : '#003344'; ctx.fill()
        noGlow()
        // connection to dept
        ctx.beginPath(); ctx.moveTo(dx,dy); ctx.lineTo(nx,ny)
        ctx.strokeStyle=ag.a?`${d.c}66`:'#002233'; ctx.lineWidth=.6; ctx.stroke()
        // name
        ctx.font='7.5px Courier New'; ctx.textAlign='center'; ctx.textBaseline='top'
        ctx.fillStyle=ag.a?d.c+'99':'#003344'
        ctx.fillText(ag.n, nx, ny+7)
        ctx.restore()
      })
    }
  })
}

function drawBrainMesh(cx,cy,t) {
  const sc = Math.min(W,H)*.115
  const segs = 10  // icosahedron-like segments

  // Animate surface with noise
  function nPt(a,b,amp=1){
    const nx = Math.sin(a*3.1+t*.3)*Math.cos(b*2.7-t*.2)
    const ny = Math.sin(a*1.8+t*.25)*Math.sin(b*4.1+t*.15)
    return amp*(nx*.12+ny*.08)
  }

  // Inner filled shape
  ctx.save()
  const brain_pts = []
  const layers = 14, pts_per = 22
  for(let li=0;li<layers;li++){
    const phi = (li/(layers-1))*Math.PI
    const row=[]
    for(let pi=0;pi<=pts_per;pi++){
      const theta = (pi/pts_per)*Math.PI*2
      const r = sc*(1 + nPt(phi,theta))
      const x = cx + r*Math.sin(phi)*Math.cos(theta)
      const y = cy - r*Math.cos(phi)*.62 + r*Math.sin(phi)*Math.sin(theta)*.3
      row.push([x,y])
    }
    brain_pts.push(row)
  }

  // Draw filled silhouette
  ctx.beginPath()
  brain_pts[0].forEach(([x,y],i)=>i===0?ctx.moveTo(x,y):ctx.lineTo(x,y))
  for(let li=1;li<layers;li++){
    brain_pts[li].forEach(([x,y],pi)=>{
      if(pi===0) ctx.moveTo(x,y); else ctx.lineTo(x,y)
    })
  }
  const fillG = ctx.createRadialGradient(cx,cy-sc*.1,sc*.1,cx,cy,sc*1.2)
  fillG.addColorStop(0,'rgba(0,40,80,.65)')
  fillG.addColorStop(.6,'rgba(0,20,50,.4)')
  fillG.addColorStop(1,'rgba(0,5,18,.1)')
  ctx.fillStyle=fillG; ctx.fill()

  // Draw wireframe lines
  const pulse = .5+.5*Math.sin(t*1.8)
  for(let li=0;li<layers;li+=2){
    ctx.beginPath()
    brain_pts[li].forEach(([x,y],i)=>i===0?ctx.moveTo(x,y):ctx.lineTo(x,y))
    ctx.strokeStyle=`rgba(0,229,255,${.05+pulse*.03})`; ctx.lineWidth=.6; ctx.stroke()
  }
  for(let pi=0;pi<pts_per;pi+=3){
    ctx.beginPath()
    brain_pts.forEach(row=>{
      const [x,y]=row[pi]||row[0]
      ctx.lineTo(x,y)
    })
    ctx.strokeStyle=`rgba(0,229,255,${.04+pulse*.025})`; ctx.lineWidth=.5; ctx.stroke()
  }

  // Bright equatorial rim (fresnel-like)
  ctx.save(); ctx.translate(cx,cy); ctx.scale(1,.28)
  const rim=ctx.createRadialGradient(0,0,sc*.88,0,0,sc*1.12)
  rim.addColorStop(0,'rgba(0,229,255,0)')
  rim.addColorStop(.7,`rgba(0,229,255,${.18+pulse*.12})`)
  rim.addColorStop(1,'rgba(0,229,255,0)')
  ctx.strokeStyle=rim; ctx.lineWidth=sc*.24
  ctx.beginPath(); ctx.arc(0,0,sc,0,Math.PI*2); ctx.stroke()
  ctx.restore()

  // Scanline sweeps
  for(let s=0;s<4;s++){
    const scanY = cy - sc + ((t*50+s*40)%(sc*2))
    if(scanY>cy-sc && scanY<cy+sc){
      const dx2 = Math.sqrt(Math.max(0,sc*sc-(scanY-cy)*(scanY-cy)))
      ctx.beginPath(); ctx.moveTo(cx-dx2,scanY); ctx.lineTo(cx+dx2,scanY)
      ctx.strokeStyle=`rgba(0,229,255,.25)`; ctx.lineWidth=.8; ctx.stroke()
    }
  }

  // Outer glow halo
  ctx.save(); ctx.translate(cx,cy); ctx.scale(1,.62)
  const halo=ctx.createRadialGradient(0,0,sc*.9,0,0,sc*1.4)
  halo.addColorStop(0,`rgba(0,229,255,${.07+pulse*.05})`)
  halo.addColorStop(1,'rgba(0,229,255,0)')
  ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(0,0,sc*1.4,0,Math.PI*2); ctx.fill()
  ctx.restore()

  // Sparkle dots around brain
  for(let sp=0;sp<12;sp++){
    const sa = sp*Math.PI*2/12+t*.4
    const sr = sc*(1.05+.15*Math.sin(t+sp))
    const sx = cx+Math.cos(sa)*sr, sy=cy+Math.sin(sa)*sr*.6
    const alpha = .4+.4*Math.sin(t*2+sp)
    glow('#00e5ff',8)
    ctx.beginPath(); ctx.arc(sx,sy,1.5,0,Math.PI*2)
    ctx.fillStyle=`rgba(0,229,255,${alpha})`; ctx.fill()
  }
  noGlow()
  ctx.restore()
}

// ── ANIMATION LOOP ────────────────────────────────────────────────────────────
let hoverIdx = -1
let lastTime = 0

function loop(ts) {
  const dt = Math.min((ts - lastTime)/1000, .05)
  lastTime = ts
  t += dt
  if(selDept>=0) expandT += dt

  if(view==='holo') drawHolo()
  else drawBrain()

  requestAnimationFrame(loop)
}
requestAnimationFrame(loop)

// ── MOUSE INTERACTION ─────────────────────────────────────────────────────────
function getPos(e) {
  const r=cv.getBoundingClientRect()
  return [e.clientX-r.left, e.clientY-r.top]
}

cv.addEventListener('mousemove', e=>{
  if(view!=='holo'){hoverIdx=-1;return}
  const [mx,my]=getPos(e)
  hoverIdx=-1
  ;(window._tagRects||[]).forEach(({x,y,w,h,i})=>{
    if(mx>=x&&mx<=x+w&&my>=y&&my<=y+h) hoverIdx=i
  })
  cv.style.cursor=hoverIdx>=0?'pointer':'default'
})

cv.addEventListener('click', e=>{
  const [mx,my]=getPos(e)
  if(view==='holo'){
    let hit=-1
    ;(window._tagRects||[]).forEach(({x,y,w,h,i})=>{
      if(mx>=x&&mx<=x+w&&my>=y&&my<=y+h) hit=i
    })
    if(hit>=0) openSP(hit)
  } else {
    let hit=-1
    deptNodes.forEach(({x,y,r,i})=>{
      if(Math.hypot(mx-x,my-y)<=r+8) hit=i
    })
    if(hit>=0){
      if(selDept===hit){closeDP();selDept=-1;expandT=0}
      else{selDept=hit;expandT=0;openDP(hit)}
    }
  }
})

// ── SKILL PANEL ───────────────────────────────────────────────────────────────
function openSP(i){
  const sk=SKILLS[i]; selSkill=i
  document.getElementById('sp-n').textContent='◈ '+sk.name
  document.getElementById('sp-d').textContent=sk.desc
  document.getElementById('sp-l').textContent='PROFICIENCY — '+sk.level+'%'
  document.getElementById('sp-b').style.width='0%'
  document.getElementById('sp').classList.add('on')
  setTimeout(()=>document.getElementById('sp-b').style.width=sk.level+'%',50)
}
function closeSP(){document.getElementById('sp').classList.remove('on');selSkill=-1}
window.closeSP=closeSP

// ── DEPT PANEL ────────────────────────────────────────────────────────────────
function openDP(i){
  const d=DEPTS[i]
  const el=document.getElementById('dp')
  el.style.borderColor=d.c
  document.getElementById('dp-n').textContent='◈ '+d.n
  document.getElementById('dp-n').style.color=d.c
  document.getElementById('dp-d').textContent=d.desc
  document.getElementById('dp-a').innerHTML=d.ag.map(a=>`
    <div class="arow">
      <span class="adot" style="background:${a.a?d.c:'#003344'};box-shadow:${a.a?'0 0 8px '+d.c:'none'}"></span>
      <span class="aname">${a.n}</span>
      <span class="ast" style="color:${a.a?d.c:'#003344'}">${a.a?'ACTIVE':'IDLE'}</span>
    </div>`).join('')
  el.classList.add('on')
}
function closeDP(){document.getElementById('dp').classList.remove('on');selDept=-1;expandT=0}
window.closeDP=closeDP

// ── SCENE SWITCH ──────────────────────────────────────────────────────────────
function switchTo(v){
  view=v
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'))
  document.getElementById('t-'+v).classList.add('on')
  document.getElementById('hl').textContent = v==='holo'?'◉ HOLOGRAM ACTIVE':'◉ NEURAL MAP ACTIVE'
  if(v==='holo') closeDP()
  else closeSP()
}
window.switchScene = switchTo  // compatibility alias
