<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'

// ── SHADERS ──────────────────────────────────────────────────────────────────

const AVATAR_VERT = `
varying vec2 vUv;
void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}
`
const AVATAR_FRAG = `
uniform sampler2D map;uniform float time;uniform float opacity;uniform vec3 glow;
varying vec2 vUv;
float rand(vec2 c){return fract(sin(dot(c,vec2(12.9898,78.233)))*43758.5453);}
void main(){
  float gs=floor(time*8.);
  float gb=step(rand(vec2(gs,.7)),vUv.y)*step(vUv.y,rand(vec2(gs,.5))+.12);
  float gstr=step(.93,rand(vec2(gs,.3)));
  vec2 uv=vUv+vec2(gstr*gb*(rand(vec2(gs))-.5)*.05,0.);
  vec4 tex=texture2D(map,clamp(uv,0.,1.));
  if(tex.a<.04)discard;
  float scan=pow(sin(vUv.y*320.-time*4.)*.5+.5,10.)*.18;
  float fine=sin(vUv.y*1200.+time*14.)*.012;
  float flick=1.-.07*sin(time*19.)*sin(time*7.+2.);
  vec3 col=mix(tex.rgb,glow,.28)+glow*scan+fine;
  float edge=min(min(vUv.x,1.-vUv.x),min(vUv.y,1.-vUv.y));
  col+=glow*.6*(1.-smoothstep(0.,.12,edge));
  gl_FragColor=vec4(col,tex.a*opacity*flick);
}
`
const BEAM_VERT = `
varying vec2 vUv;varying float vH;
void main(){vUv=uv;vH=(position.y+1.)*.5;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}
`
const BEAM_FRAG = `
uniform float time;uniform vec3 col;uniform float opacity;
varying vec2 vUv;varying float vH;
void main(){
  float r=length(vUv-.5)*2.;
  float cone=1.-smoothstep((1.-vH)*.8,(1.-vH),r);
  float scan=pow(sin(vH*55.-time*5.)*.5+.5,5.)*.35;
  float core=max(0.,(1.-r)*(1.-vH*.5))*.5;
  float p=.8+.2*sin(time*2.5);
  gl_FragColor=vec4(col,(core+scan*cone)*opacity*p);
}
`
const PART_VERT = `
attribute float aSize;attribute float aLife;attribute vec3 aVel;
uniform float time;varying float vA;
void main(){
  float t=fract(time*.4+aLife);
  vec3 p=position+aVel*t*2.5;p.y+=t*1.8;
  vA=(1.-t)*(1.-t);
  vec4 mv=modelViewMatrix*vec4(p,1.);
  gl_PointSize=aSize*(220./-mv.z);gl_Position=projectionMatrix*mv;
}
`
const PART_FRAG = `
uniform vec3 col;varying float vA;
void main(){
  float d=length(gl_PointCoord-.5)*2.;
  if(d>1.)discard;
  gl_FragColor=vec4(col,(1.-d)*vA);
}
`
const BRAIN_VERT = `
uniform float time;varying vec3 vN;varying vec3 vP;
float h(vec3 p){p=fract(p*.3183+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float n3(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
  return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z);}
void main(){
  vN=normalize(normalMatrix*normal);
  vec3 p=position;
  p+=normal*(n3(p*2.2+time*.25)*.18+n3(p*4.8-time*.18)*.09+n3(p*9.+time*.4)*.04);
  vP=p;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);
}
`
const BRAIN_FRAG = `
uniform float time;uniform vec3 base;uniform vec3 glow;uniform float opacity;
varying vec3 vN;varying vec3 vP;
void main(){
  float fr=pow(1.-abs(dot(normalize(vN),vec3(0,0,1))),1.6);
  float sc=pow(sin(vP.y*14.+time*2.5)*.5+.5,7.)*.45;
  float pu=.5+.5*sin(time*1.8);
  float fl=pow(max(0.,sin(time*.7)*sin(time*1.3)),8.)*.4;
  vec3 c=mix(base,glow,fr*.75+sc+pu*.08+fl);
  gl_FragColor=vec4(c,opacity*(.25+fr*.55+sc*.2+fl));
}
`

// ── TEXTURE HELPERS ──────────────────────────────────────────────────────────

function makeAvatarTex() {
  const S=512, cv=document.createElement('canvas')
  cv.width=cv.height=S
  const c=cv.getContext('2d')

  c.fillStyle='#001122'; c.fillRect(0,0,S,S)
  const bg=c.createRadialGradient(256,256,40,256,256,270)
  bg.addColorStop(0,'rgba(0,80,120,.55)'); bg.addColorStop(1,'rgba(0,10,20,0)')
  c.fillStyle=bg; c.fillRect(0,0,S,S)

  c.strokeStyle='#00e5ff'; c.lineWidth=2.5
  c.shadowColor='#00e5ff'; c.shadowBlur=16

  // Head
  c.beginPath(); c.ellipse(256,168,76,92,0,0,Math.PI*2); c.stroke()

  // Eyes
  c.fillStyle='#00e5ff'; c.shadowBlur=22
  c.beginPath(); c.ellipse(223,163,15,9,0,0,Math.PI*2); c.fill()
  c.beginPath(); c.ellipse(289,163,15,9,0,0,Math.PI*2); c.fill()
  c.fillStyle='#001122'; c.shadowBlur=0
  c.beginPath(); c.arc(223,163,5,0,Math.PI*2); c.fill()
  c.beginPath(); c.arc(289,163,5,0,Math.PI*2); c.fill()

  // Pupils glow
  c.fillStyle='rgba(0,229,255,.5)'; c.shadowBlur=8; c.shadowColor='#00e5ff'
  c.beginPath(); c.arc(223,163,2,0,Math.PI*2); c.fill()
  c.beginPath(); c.arc(289,163,2,0,Math.PI*2); c.fill()

  // Neck
  c.strokeStyle='#00e5ff'; c.lineWidth=2; c.shadowBlur=10
  c.beginPath()
  c.moveTo(232,258); c.lineTo(232,296)
  c.moveTo(280,258); c.lineTo(280,296)
  c.stroke()

  // Shoulders & body
  c.lineWidth=2.5; c.shadowBlur=12
  c.beginPath()
  c.moveTo(232,296); c.bezierCurveTo(195,305,145,318,138,368); c.lineTo(155,490)
  c.moveTo(280,296); c.bezierCurveTo(317,305,367,318,374,368); c.lineTo(357,490)
  c.moveTo(138,368); c.bezierCurveTo(128,390,126,412,140,438); c.lineTo(118,490)
  c.moveTo(374,368); c.bezierCurveTo(384,390,386,412,372,438); c.lineTo(394,490)
  c.moveTo(256,296); c.lineTo(256,490)
  c.moveTo(155,345); c.lineTo(357,345)
  c.moveTo(158,390); c.lineTo(354,390)
  c.moveTo(163,435); c.lineTo(349,435)
  c.stroke()

  // Circuit detail
  c.strokeStyle='#004466'; c.lineWidth=1; c.shadowBlur=4
  for(let i=0;i<8;i++){
    c.beginPath()
    c.moveTo(175,308+i*14); c.lineTo(185+Math.random()*35,308+i*14)
    c.moveTo(337,308+i*14); c.lineTo(327-Math.random()*35,308+i*14)
    c.stroke()
  }

  // Scanlines overlay
  c.strokeStyle='rgba(0,229,255,.03)'; c.lineWidth=1; c.shadowBlur=0
  for(let y=0;y<S;y+=3){c.beginPath();c.moveTo(0,y);c.lineTo(S,y);c.stroke()}

  // Vignette
  const vg=c.createRadialGradient(256,256,150,256,256,300)
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.7)')
  c.fillStyle=vg; c.fillRect(0,0,S,S)

  return new THREE.CanvasTexture(cv)
}

function makeSkillTex(name) {
  const cv=document.createElement('canvas'); cv.width=280; cv.height=68
  const c=cv.getContext('2d')
  c.fillStyle='rgba(0,18,42,.93)'; c.fillRect(0,0,280,68)
  c.strokeStyle='#006688'; c.lineWidth=1.5; c.strokeRect(1,1,278,66)
  // corner accents
  [[3,3],[277,3],[3,65],[277,65]].forEach(([x,y])=>{
    c.fillStyle='#00e5ff'; c.fillRect(x-3,y-3,6,6)
  })
  c.fillStyle='#00e5ff'; c.font='bold 13px Courier New'
  c.textAlign='center'; c.textBaseline='middle'
  c.shadowColor='#00e5ff'; c.shadowBlur=10
  c.fillText(name,140,34)
  return new THREE.CanvasTexture(cv)
}

function makeLabelTex(text, color='#00e5ff') {
  const cv=document.createElement('canvas'); cv.width=320; cv.height=52
  const c=cv.getContext('2d')
  c.fillStyle=color; c.font='bold 15px Courier New'
  c.textAlign='center'; c.textBaseline='middle'
  c.shadowColor=color; c.shadowBlur=14
  c.fillText(text,160,26)
  return new THREE.CanvasTexture(cv)
}

// ── RENDERER ─────────────────────────────────────────────────────────────────

const wrap = document.getElementById('canvas-wrap')
const W = window.innerWidth, H = window.innerHeight - 52

const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
renderer.setSize(W, H)
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.1
renderer.outputColorSpace = THREE.SRGBColorSpace
wrap.appendChild(renderer.domElement)

const clock = new THREE.Clock()
const raycaster = new THREE.Raycaster()
const mouse = new THREE.Vector2()
let currentView = 'hologram'

// ── HOLOGRAM SCENE ───────────────────────────────────────────────────────────

const HS = new THREE.Scene()
HS.background = new THREE.Color('#000810')
HS.fog = new THREE.Fog('#000810', 14, 30)

const HC = new THREE.PerspectiveCamera(44, W/H, 0.1, 100)
HC.position.set(0, 1, 5.5)

const HCtrl = new OrbitControls(HC, renderer.domElement)
HCtrl.enableZoom = false; HCtrl.enablePan = false
HCtrl.minPolarAngle = Math.PI/4; HCtrl.maxPolarAngle = Math.PI/1.6
HCtrl.rotateSpeed = 0.45; HCtrl.autoRotate = true; HCtrl.autoRotateSpeed = 0.5

// Lights
HS.add(new THREE.AmbientLight('#000810', 0.1))
const hL1 = new THREE.PointLight('#00e5ff', 2.5, 12); hL1.position.set(0,5,0); HS.add(hL1)
const hL2 = new THREE.PointLight('#0033ff', 1.2, 8);  hL2.position.set(0,-2,0); HS.add(hL2)

// Stars
function addStars(scene, n=2000) {
  const pos = new Float32Array(n*3)
  for(let i=0;i<n;i++){
    const r=50+Math.random()*20, t=Math.random()*Math.PI*2, p=Math.acos(2*Math.random()-1)
    pos[i*3]=r*Math.sin(p)*Math.cos(t); pos[i*3+1]=r*Math.sin(p)*Math.sin(t); pos[i*3+2]=r*Math.cos(p)
  }
  const geo=new THREE.BufferGeometry()
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3))
  scene.add(new THREE.Points(geo,new THREE.PointsMaterial({color:'#ffffff',size:.12,transparent:true,opacity:.55})))
}
addStars(HS)

// Grid floor
function addGrid(scene, y=-2.2) {
  const g=new THREE.GridHelper(24,48,new THREE.Color('#00ccff'),new THREE.Color('#002233'))
  g.position.y=y; g.material.transparent=true; g.material.opacity=0.12; scene.add(g)
  ;[1.0,2.2,3.6,5.2].forEach((r,i)=>{
    const m=new THREE.Mesh(
      new THREE.RingGeometry(r-.015,r,80),
      new THREE.MeshBasicMaterial({color:'#00e5ff',transparent:true,opacity:.1/(i+1),side:THREE.DoubleSide})
    )
    m.rotation.x=-Math.PI/2; m.position.y=y; scene.add(m)
  })
  return g
}
const hGrid = addGrid(HS)

// Projection beam
const beamMat = new THREE.ShaderMaterial({
  vertexShader:BEAM_VERT, fragmentShader:BEAM_FRAG,
  uniforms:{time:{value:0},col:{value:new THREE.Color('#00e5ff')},opacity:{value:.22}},
  transparent:true, side:THREE.DoubleSide, depthWrite:false, blending:THREE.AdditiveBlending
})
const bG = new THREE.Group(); bG.position.set(0,-2.2,0); HS.add(bG)
const cone1 = new THREE.Mesh(new THREE.ConeGeometry(1.4,4,48,1,true), beamMat)
cone1.position.y=2; bG.add(cone1)
const cone2 = new THREE.Mesh(new THREE.ConeGeometry(.45,4,24,1,true), beamMat)
cone2.position.y=2; bG.add(cone2)
const disc = new THREE.Mesh(new THREE.CircleGeometry(1.4,48),
  new THREE.MeshBasicMaterial({color:'#00e5ff',transparent:true,opacity:.2,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}))
disc.rotation.x=-Math.PI/2; bG.add(disc)

// Avatar plane
const avatarTex = makeAvatarTex()
const avatarMat = new THREE.ShaderMaterial({
  vertexShader:AVATAR_VERT, fragmentShader:AVATAR_FRAG,
  uniforms:{map:{value:avatarTex},time:{value:0},opacity:{value:.9},glow:{value:new THREE.Color('#00e5ff')}},
  transparent:true, side:THREE.DoubleSide, depthWrite:false
})
HS.add(new THREE.Mesh(new THREE.PlaneGeometry(2.2,2.8), avatarMat))

// Particles
;(()=>{
  const N=200, pos=new Float32Array(N*3), sz=new Float32Array(N), lf=new Float32Array(N), vel=new Float32Array(N*3)
  for(let i=0;i<N;i++){
    const a=Math.random()*Math.PI*2, r=Math.random()*1.1
    pos[i*3]=Math.cos(a)*r; pos[i*3+1]=(Math.random()-.4)*2.8; pos[i*3+2]=(Math.random()-.5)*.3
    sz[i]=Math.random()*5+2; lf[i]=Math.random()
    vel[i*3]=(Math.random()-.5)*.6; vel[i*3+1]=Math.random()*.25+.05; vel[i*3+2]=(Math.random()-.5)*.25
  }
  const geo=new THREE.BufferGeometry()
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3))
  geo.setAttribute('aSize',new THREE.BufferAttribute(sz,1))
  geo.setAttribute('aLife',new THREE.BufferAttribute(lf,1))
  geo.setAttribute('aVel',new THREE.BufferAttribute(vel,3))
  window._partMat = new THREE.ShaderMaterial({
    vertexShader:PART_VERT, fragmentShader:PART_FRAG,
    uniforms:{time:{value:0},col:{value:new THREE.Color('#00e5ff')}},
    transparent:true, blending:THREE.AdditiveBlending, depthWrite:false
  })
  HS.add(new THREE.Points(geo, window._partMat))
})()

// Orbit rings
[[1.9,0],[2.5,Math.PI/6],[3.1,-Math.PI/5],[3.7,Math.PI/4]].forEach(([r,tilt],i)=>{
  const m=new THREE.Mesh(new THREE.RingGeometry(r-.012,r+.012,72),
    new THREE.MeshBasicMaterial({color:'#00e5ff',transparent:true,opacity:.12+i*.02,side:THREE.DoubleSide,depthWrite:false}))
  m.rotation.x=tilt; HS.add(m)
})

// Skill tags
const SKILLS=[
  {name:'MACHINE LEARNING',level:95,desc:'Deep neural network design & training pipelines.'},
  {name:'NLP PROCESSING',  level:88,desc:'Language model fine-tuning and RAG systems.'},
  {name:'COMPUTER VISION', level:82,desc:'Real-time image analysis and segmentation.'},
  {name:'DATA ENGINEERING',level:79,desc:'Distributed processing at petabyte scale.'},
  {name:'API DESIGN',      level:91,desc:'RESTful & GraphQL microservice architecture.'},
  {name:'CLOUD DEPLOY',    level:85,desc:'Kubernetes orchestration across multi-cloud.'},
]

const skillObjs = SKILLS.map((sk,i)=>{
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:makeSkillTex(sk.name),transparent:true,depthWrite:false}))
  spr.scale.set(1.45,.44,1); spr.userData={sk}; HS.add(spr)
  return {spr,sk,r:1.8+(i%3)*.78,spd:.22+i*.06,y:(i%2===0?.55:-.4)+i*.08,a0:(i/SKILLS.length)*Math.PI*2}
})
const hClickable = skillObjs.map(o=>o.spr)

// Agent label
const nameSpr = new THREE.Sprite(new THREE.SpriteMaterial({map:makeLabelTex('NEXUS — AI ARCHITECT','#00e5ff'),transparent:true}))
nameSpr.scale.set(2.6,.32,1); nameSpr.position.y=-1.72; HS.add(nameSpr)
const roleSpr = new THREE.Sprite(new THREE.SpriteMaterial({map:makeLabelTex('SENIOR AI ARCHITECT','#005577'),transparent:true}))
roleSpr.scale.set(2,.22,1); roleSpr.position.y=-2.0; HS.add(roleSpr)

// Hologram composer
const HC_comp = new EffectComposer(renderer)
HC_comp.addPass(new RenderPass(HS, HC))
HC_comp.addPass(new UnrealBloomPass(new THREE.Vector2(W,H), 1.8, .85, .1))

// ── BRAIN SCENE ──────────────────────────────────────────────────────────────

const BS = new THREE.Scene()
BS.background = new THREE.Color('#000812')
BS.fog = new THREE.Fog('#000812', 14, 32)

const BC = new THREE.PerspectiveCamera(50, W/H, 0.1, 100)
BC.position.set(0,3,9)

const BCtrl = new OrbitControls(BC, renderer.domElement)
BCtrl.enablePan = false; BCtrl.minDistance=4; BCtrl.maxDistance=18
BCtrl.autoRotate=true; BCtrl.autoRotateSpeed=.28; BCtrl.rotateSpeed=.5
BCtrl.enabled = false

BS.add(new THREE.AmbientLight('#000810',.05))
const bL1=new THREE.PointLight('#00e5ff',3,14); bL1.position.set(0,4,0); BS.add(bL1)
const bL2=new THREE.PointLight('#0033ff',1.5,10); bL2.position.set(0,-3,0); BS.add(bL2)
addStars(BS,3000)
const bGrid = addGrid(BS,-3.5)

// Brain
const brainMat = new THREE.ShaderMaterial({
  vertexShader:BRAIN_VERT, fragmentShader:BRAIN_FRAG,
  uniforms:{time:{value:0},base:{value:new THREE.Color('#001a3a')},glow:{value:new THREE.Color('#00e5ff')},opacity:{value:.75}},
  transparent:true, depthWrite:false
})
const brainGeo = new THREE.IcosahedronGeometry(1.55,5)
BS.add(new THREE.Mesh(brainGeo, brainMat))
const wm = new THREE.Mesh(brainGeo, new THREE.MeshBasicMaterial({color:'#00e5ff',wireframe:true,transparent:true,opacity:.06}))
wm.scale.setScalar(1.005); BS.add(wm)
BS.add(new THREE.Mesh(new THREE.SphereGeometry(1.85,32,32),
  new THREE.MeshBasicMaterial({color:'#00e5ff',transparent:true,opacity:.03,side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false})))

// Departments
const DEPTS=[
  {id:'d1',name:'RESEARCH CORE',    color:'#00e5ff',desc:'Advanced AI research cluster.',  agents:[{n:'NEXUS',active:true},{n:'ARIA',active:true},{n:'HELIOS',active:false}]},
  {id:'d2',name:'DATA MINING',      color:'#0088ff',desc:'Data extraction & recognition.',  agents:[{n:'VECTOR',active:true},{n:'SIGMA',active:true}]},
  {id:'d3',name:'NEURAL SYNTHESIS', color:'#00ffaa',desc:'Knowledge synthesis node.',       agents:[{n:'LYRA',active:true},{n:'ORION',active:true},{n:'PULSE',active:false},{n:'ECHO',active:true}]},
  {id:'d4',name:'DEPLOYMENT',       color:'#ff6600',desc:'Production orchestration.',       agents:[{n:'TITAN',active:true},{n:'ATLAS',active:false}]},
  {id:'d5',name:'SECURITY',         color:'#aa00ff',desc:'Threat detection & audit.',       agents:[{n:'SHIELD',active:true},{n:'CIPHER',active:true}]},
  {id:'d6',name:'ANALYTICS',        color:'#ffcc00',desc:'Metrics & predictive analytics.', agents:[{n:'PRISM',active:true},{n:'LENS',active:false}]},
]

const deptObjs = DEPTS.map((d,i)=>{
  const col=new THREE.Color(d.color)
  const tier=Math.floor(i/4)
  const orR=2.6+tier*1.0, orY=(i%2===0?.8:-.8)*(1+tier*.3)
  const orA=(i/DEPTS.length)*Math.PI*2, orS=(0.12+i*.025)*(i%2===0?1:-1)

  const sph=new THREE.Mesh(new THREE.SphereGeometry(.22,16,16),new THREE.MeshBasicMaterial({color:col}))
  BS.add(sph)
  const ring=new THREE.Mesh(new THREE.RingGeometry(.28,.34,32),
    new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.5,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}))
  BS.add(ring)
  const halo=new THREE.Mesh(new THREE.SphereGeometry(.45,12,12),
    new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.04,side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false}))
  BS.add(halo)
  const lbl=new THREE.Sprite(new THREE.SpriteMaterial({map:makeLabelTex(d.name,d.color),transparent:true}))
  lbl.scale.set(1.6,.24,1); BS.add(lbl)

  sph.userData={d,i}
  return {sph,ring,halo,lbl,d,orR,orY,orA,orS,pos:new THREE.Vector3()}
})

// Synapse lines
const synLines = []
for(let i=0;i<DEPTS.length;i++){
  const j=(i+1)%DEPTS.length
  const geo=new THREE.BufferGeometry()
  const arr=new Float32Array(6); geo.setAttribute('position',new THREE.BufferAttribute(arr,3))
  const mat=new THREE.LineBasicMaterial({color:'#003344',transparent:true,opacity:.25})
  const ln=new THREE.Line(geo,mat); BS.add(ln)
  synLines.push({ln,fi:i,ti:j,mat,pos:geo.attributes.position})
}

const bClickable = deptObjs.map(o=>o.sph)

// Agent neurons
const aNeurons=[]
let selDept=-1

// Brain composer
const BC_comp = new EffectComposer(renderer)
BC_comp.addPass(new RenderPass(BS,BC))
BC_comp.addPass(new UnrealBloomPass(new THREE.Vector2(W,H),2.0,.9,.08))

// ── CLICK INTERACTION ─────────────────────────────────────────────────────────

renderer.domElement.addEventListener('click', e=>{
  const rect=renderer.domElement.getBoundingClientRect()
  mouse.x=((e.clientX-rect.left)/rect.width)*2-1
  mouse.y=-((e.clientY-rect.top)/rect.height)*2+1
  if(currentView==='hologram'){
    raycaster.setFromCamera(mouse,HC)
    const h=raycaster.intersectObjects(hClickable)
    if(h.length) showSkill(h[0].object.userData.sk)
  } else {
    raycaster.setFromCamera(mouse,BC)
    const h=raycaster.intersectObjects(bClickable)
    if(h.length){const {d,i}=h[0].object.userData; selectDept(d,i)}
  }
})

function showSkill(sk){
  document.getElementById('sp-name').textContent='◈ '+sk.name
  document.getElementById('sp-desc').textContent=sk.desc
  document.getElementById('sp-bar-lbl').textContent='PROFICIENCY — '+sk.level+'%'
  document.getElementById('sp-bar').style.width='0%'
  document.getElementById('skill-panel').classList.add('visible')
  setTimeout(()=>document.getElementById('sp-bar').style.width=sk.level+'%',50)
}
window.closeSkillPanel=()=>document.getElementById('skill-panel').classList.remove('visible')

function selectDept(d,i){
  if(selDept===i){clearNeurons();selDept=-1;document.getElementById('dept-panel').classList.remove('visible');return}
  selDept=i
  document.getElementById('dp-name').textContent='◈ '+d.name
  document.getElementById('dp-name').style.color=d.color
  document.getElementById('dept-panel').style.borderColor=d.color
  document.getElementById('dp-desc').textContent=d.desc
  document.getElementById('dp-agents').innerHTML=d.agents.map(a=>`
    <div class="agent-row">
      <span class="agent-dot" style="background:${a.active?d.color:'#003344'};box-shadow:${a.active?'0 0 8px '+d.color:'none'}"></span>
      <span class="agent-name">${a.n}</span>
      <span class="agent-status" style="color:${a.active?d.color:'#003344'}">${a.active?'ACTIVE':'IDLE'}</span>
    </div>`).join('')
  document.getElementById('dept-panel').classList.add('visible')
  clearNeurons(); spawnNeurons(d,i)
}
window.closeDeptPanel=()=>{document.getElementById('dept-panel').classList.remove('visible');selDept=-1;clearNeurons()}

function clearNeurons(){
  aNeurons.forEach(n=>{BS.remove(n.m);BS.remove(n.l)})
  aNeurons.length=0
}
function spawnNeurons(d,di){
  const col=new THREE.Color(d.color)
  d.agents.forEach((a,i)=>{
    const m=new THREE.Mesh(new THREE.SphereGeometry(.1,10,10),new THREE.MeshBasicMaterial({color:col}))
    BS.add(m)
    const l=new THREE.Sprite(new THREE.SpriteMaterial({map:makeLabelTex(a.n,d.color),transparent:true}))
    l.scale.set(.8,.14,1); BS.add(l)
    aNeurons.push({m,l,di,i,tot:d.agents.length,a0:(i/d.agents.length)*Math.PI*2})
  })
}

// ── ANIMATE ──────────────────────────────────────────────────────────────────

function animate(){
  requestAnimationFrame(animate)
  const t=clock.getElapsedTime()

  if(currentView==='hologram'){
    HCtrl.update()
    avatarMat.uniforms.time.value=t
    beamMat.uniforms.time.value=t
    if(window._partMat) window._partMat.uniforms.time.value=t
    hGrid.material.opacity=.12+Math.sin(t*.6)*.04

    skillObjs.forEach(({spr,r,spd,y,a0})=>{
      const a=a0+t*spd
      spr.position.set(Math.cos(a)*r, y+Math.sin(t*.8+a0)*.12, Math.sin(a)*r)
    })
    HC_comp.render()

  } else {
    BCtrl.update()
    brainMat.uniforms.time.value=t
    bGrid.material.opacity=.08+Math.sin(t*.4)*.03

    deptObjs.forEach((o,i)=>{
      const a=o.orA+t*o.orS
      const x=Math.cos(a)*o.orR, z=Math.sin(a)*o.orR
      const y=o.orY+Math.sin(t*.6+o.orA)*.15
      o.pos.set(x,y,z)
      o.sph.position.copy(o.pos)
      o.ring.position.copy(o.pos)
      o.ring.rotation.x=Math.PI/2
      o.halo.position.copy(o.pos)
      o.lbl.position.set(x,y+.44,z)
      const p=1+.22*Math.sin(t*2+o.orA); o.ring.scale.setScalar(p)
      const sel=selDept===i
      o.sph.material.color.set(sel?'#ffffff':o.d.color)
      o.halo.material.opacity=sel?.12:.04
    })

    synLines.forEach(({ln,fi,ti,mat,pos})=>{
      const f=deptObjs[fi].pos, to2=deptObjs[ti].pos
      pos.setXYZ(0,f.x,f.y,f.z); pos.setXYZ(1,to2.x,to2.y,to2.z); pos.needsUpdate=true
      const act=selDept===fi||selDept===ti
      mat.opacity=act?.7:.15+Math.sin(t*1.5+fi)*.04
      mat.color.set(act?'#00e5ff':'#003344')
    })

    aNeurons.forEach(n=>{
      const dp=deptObjs[n.di].pos
      const a=n.a0+t*.38, r=.9+.15*Math.sin(t*.7+n.i)
      const x=dp.x+Math.cos(a)*r, z=dp.z+Math.sin(a)*r
      const y=dp.y+Math.sin(t*1.1+n.i*1.3)*.22
      n.m.position.set(x,y,z); n.l.position.set(x,y+.26,z)
      n.m.scale.setScalar(1+.2*Math.sin(t*3.5+n.i*2.1))
    })
    BC_comp.render()
  }
}
animate()

// ── SWITCH SCENE ─────────────────────────────────────────────────────────────

window.switchScene = v => {
  currentView=v
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'))
  document.getElementById('btn-'+v).classList.add('active')
  HCtrl.enabled = v==='hologram'
  BCtrl.enabled = v==='brain'
  document.getElementById('hud-left').textContent = v==='hologram' ? '◉ HOLOGRAM ACTIVE' : '◉ NEURAL MAP ACTIVE'
  if(v==='hologram') document.getElementById('dept-panel').classList.remove('visible')
  else document.getElementById('skill-panel').classList.remove('visible')
}

// ── RESIZE ───────────────────────────────────────────────────────────────────

window.addEventListener('resize',()=>{
  const nw=window.innerWidth, nh=window.innerHeight-52
  renderer.setSize(nw,nh)
  HC_comp.setSize(nw,nh); BC_comp.setSize(nw,nh)
  HC.aspect=nw/nh; HC.updateProjectionMatrix()
  BC.aspect=nw/nh; BC.updateProjectionMatrix()
})

</script>
</body>
</html>
